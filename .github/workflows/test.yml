name: Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
      - ci-debug
  schedule:
    - cron: "0 11 * * 0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '29.4'
          - '30.1'
          - '30.2'
          - '31.1'
          - 'release-snapshot'
          - 'snapshot'
        include:
          - emacs_version: 'snapshot'
            allow_failure: true
          - emacs_version: 'release-snapshot'
            allow_failure: true
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - uses: fish-actions/install-fish@master

      - name: Install Eldev
        uses: emacs-eldev/setup-eldev@v1

      - name: Install dependencies
        run: eldev prepare test

      - name: Run tests
        if: matrix.allow_failure != true
        run: eldev -p -dt test

      - name: Run tests (allow failure)
        if: matrix.allow_failure == true
        run: eldev -p -dt test || true
